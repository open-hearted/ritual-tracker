<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Quick Log</title>
  
  <style>
    :root {
      --bg: #111;
      --fg: #eee;
      --btn-bg: #222;
      --btn-active: #444;
      --accent: #ff8c00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: env(safe-area-inset-top) 20px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: #aaa;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 400px;
    }
    button.log-btn {
      background: var(--btn-bg);
      color: var(--fg);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 1.5rem 1rem;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button.log-btn:active {
      background: var(--btn-active);
      transform: scale(0.97);
    }
    button.log-btn span.icon {
      font-size: 2.5rem;
    }
    
    #status {
      margin-top: 2rem;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      min-height: 2em;
      transition: opacity 0.3s;
    }
    .status-success { color: #4ade80; }
    .status-error { color: #f87171; }
    .status-info { color: #60a5fa; }
    
    #login-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    button.login-btn {
      background: #4285F4;
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
    }
    #main-section {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }
    
    .sync-btn {
      margin-top: 2rem;
      background: transparent;
      color: #888;
      border: 1px solid #444;
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="login-section">
    <h2>Supabaseにログインしていません</h2>
    <button class="login-btn" onclick="signIn()">Googleでログイン</button>
  </div>

  <div id="main-section">
    <h1>Quick Log</h1>
    <div class="grid">
      <button class="log-btn" onclick="logTime('wake')">
        <span class="icon">🌅</span>
        <span>起床</span>
      </button>
      <button class="log-btn" onclick="logTime('awake')">
        <span class="icon">👀</span>
        <span>覚醒</span>
      </button>
      <button class="log-btn" onclick="logTime('sleep')">
        <span class="icon">🌙</span>
        <span>就寝</span>
      </button>
    </div>
    
    <div id="status"></div>
    <button class="sync-btn" onclick="syncPending()">手動同期</button>
    <br/>
    <a href="index.html" style="color:#666; text-decoration:none; margin-top:2rem;">メインアプリへ戻る</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://jlkfvijgfrvoesazegnc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yfTwumo2INpAJIJRq7_WSA_ivenN96B';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    let currentUser = null;

    const dom = {
      login: document.getElementById('login-section'),
      main: document.getElementById('main-section'),
      status: document.getElementById('status')
    };

    function showStatus(msg, type='info') {
      dom.status.className = `status-${type}`;
      dom.status.textContent = msg;
      setTimeout(() => { if(dom.status.textContent === msg) dom.status.textContent = ''; }, 3000);
    }

    async function checkAuth() {
      if(!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if(session && session.user) {
        currentUser = session.user;
        dom.login.style.display = 'none';
        dom.main.style.display = 'flex';
        syncPending();
      } else {
        dom.login.style.display = 'flex';
        dom.main.style.display = 'none';
      }
    }

    async function signIn() {
      await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if(session && session.user) {
        currentUser = session.user;
        dom.login.style.display = 'none';
        dom.main.style.display = 'flex';
        syncPending();
      } else {
        currentUser = null;
        dom.login.style.display = 'flex';
        dom.main.style.display = 'none';
      }
    });

    function getDateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
    function getMonthKey(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; }

    function getPendingQueue() {
      try { return JSON.parse(localStorage.getItem('quickLogQueue') || '[]'); } catch(e){ return []; }
    }
    function savePendingQueue(q) {
      localStorage.setItem('quickLogQueue', JSON.stringify(q));
    }

    async function logTime(kind) {
      const iso = new Date().toISOString();
      const q = getPendingQueue();
      q.push({ kind, iso });
      savePendingQueue(q);
      
      const label = kind === 'wake' ? '起床' : (kind === 'awake' ? '覚醒' : '就寝');
      showStatus(`${label}をローカルに記録しました！`, 'success');
      
      if(navigator.onLine && currentUser) {
        await syncPending();
      }
    }

    async function syncPending() {
      const q = getPendingQueue();
      if(q.length === 0) return;
      if(!currentUser) {
        showStatus('ログインしていないため同期できません', 'error');
        return;
      }
      
      showStatus(`同期中 (${q.length}件)...`, 'info');

      try {
        const { data, error } = await supabaseClient
          .from('user_data')
          .select('id, payload')
          .eq('user_id', currentUser.id)
          .maybeSingle();

        if (error) throw error;
        
        let payload = (data && data.payload) ? data.payload : {};
        if(!payload.data) payload.data = {};
        if(!payload.__meta) payload.__meta = { version: 0, updatedAt: new Date().toISOString() };

        for (let item of q) {
          const d = new Date(item.iso);
          const y = d.getFullYear();
          const m = d.getMonth();
          const p = d.getDate();
          
          const mk = getMonthKey(y, m);
          const dk = getDateKey(y, m, p);

          if(!payload.data[mk]) payload.data[mk] = {};
          if(!payload.data[mk][dk]) payload.data[mk][dk] = {};
          const rec = payload.data[mk][dk];

          if(item.kind === 'wake') {
            rec.wake = Array.isArray(rec.wake) ? rec.wake : [];
            rec.wake.push(item.iso);
          } else if(item.kind === 'awake') {
            rec.awake = Array.isArray(rec.awake) ? rec.awake : [];
            rec.awake.push(item.iso);
          } else if(item.kind === 'sleep') {
            rec.sleep = Array.isArray(rec.sleep) ? rec.sleep : [];
            rec.sleep.push(item.iso);
          }
        }

        payload.__meta.version = (payload.__meta.version || 0) + 1;
        payload.__meta.updatedAt = new Date().toISOString();

        let syncErr;
        if (data && data.id) {
          const { error } = await supabaseClient
            .from('user_data')
            .update({ payload: payload })
            .eq('id', data.id);
          syncErr = error;
        } else {
          const { error } = await supabaseClient
            .from('user_data')
            .insert({ user_id: currentUser.id, payload: payload });
          syncErr = error;
        }

        if(syncErr) throw syncErr;

        savePendingQueue([]);
        showStatus('Supabaseに同期完了！', 'success');

      } catch(e) {
        console.error('Sync failed', e);
        showStatus('同期失敗。後で再試行します。', 'error');
      }
    }

    window.addEventListener('online', syncPending);

    checkAuth();
  </script>
</body>
</html>
