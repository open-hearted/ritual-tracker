<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ritual Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <title>リファクタ（当日）</title>
  <link rel="icon" sizes="192x192" href="/ritual_tracker-192.png" type="image/png">
  <link rel="icon" sizes="512x512" href="/ritual_tracker.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/ritual_tracker-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/ritual_tracker-192.png">
  <link rel="manifest" href="/manifest-index.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-overrides-meditation.css">
  <!-- Supabase SDK の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="schedule.js"></script>
  <script defer src="meditation-cloud.js"></script>
  <style>
  /* 今日ページはモーダルUIをそのまま通常表示にする（画面幅いっぱい） */
  #medEditor{ position:static; z-index:auto; left:auto; top:auto; transform:none; background:var(--card,#0b1220); color:#e2e8f0; padding:18px; border-radius:12px; width:100%; max-width:none; display:block; max-height:none; overflow:visible; }
  #medEditor textarea{ width:100%; min-height:100px }

  /* 当日: 左=タイムライン / 右=入力 で見やすく */
  body[data-page="daily"] #dailySplit{
    display:grid;
    /* Timeline shouldn't be too wide; keep input area roomy */
    grid-template-columns: clamp(320px, 36vw, 520px) 1fr;
    gap:14px;
    align-items:start;
  }
  body[data-page="daily"] #dailyTimelineCol{
    min-width:0;
  }
  body[data-page="daily"] #dailyInputCol{
    min-width:0;
  }
  body[data-page="daily"] .panel-title{
    font-weight:700;
    opacity:0.95;
    margin: 4px 0 8px;
  }
  body[data-page="daily"] .panel-box{
    border:1px solid rgba(255,255,255,0.10);
    border-radius:10px;
    padding:12px;
    background: rgba(255,255,255,0.02);
  }
  @media (max-width: 860px){
    body[data-page="daily"] #medEditor{ width:100%; }
    /* Mobile: stack and show Timeline first */
    body[data-page="daily"] #dailySplit{ display:flex; flex-direction:column; }
    body[data-page="daily"] #dailyTimelineCol{ order: 0; }
    body[data-page="daily"] #dailyInputCol{ order: 1; }

    /* Mobile: use full width and remove section titles to save space */
    body[data-page="daily"] #dailyInputCol,
    body[data-page="daily"] #dailyTimelineCol{ width:100%; }
    body[data-page="daily"] .panel-title{ display:none; }
    body[data-page="daily"] .panel-box{ padding:10px; }
    body[data-page="daily"]{
      --daily-tap-bg: rgba(10,76,68,0.84);
      --daily-tap-border: rgba(125,211,252,0.52);
      background:
        radial-gradient(circle at 50% -12%, rgba(251,191,36,0.28), transparent 34%),
        radial-gradient(circle at 0 18%, rgba(45,212,191,0.18), transparent 36%),
        linear-gradient(180deg,#062420 0%,#10262e 58%,#211923 100%);
    }
    body[data-page="daily"] .container.compact{
      background: linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));
    }
    body[data-page="daily"] #medEditor{
      background: rgba(5,14,22,0.62);
      border: 1px solid rgba(251,191,36,0.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    body[data-page="daily"] #editSection{
      padding:8px;
      border:1px solid rgba(251,191,36,0.26);
      border-radius:10px;
      background: rgba(251,191,36,0.08);
    }
    body[data-page="daily"] #editDate{
      padding:4px 8px;
      border-radius:999px;
      color:#fde68a;
      background: rgba(251,191,36,0.16);
      border:1px solid rgba(251,191,36,0.28);
    }
    body[data-page="daily"] #dailyTimelineCol{
      background: rgba(7,23,27,0.78);
      border-color: rgba(251,191,36,0.34);
      box-shadow: inset 0 0 0 1px rgba(251,191,36,0.08);
    }
    body[data-page="daily"] #dailyInputCol{
      background: rgba(8,19,31,0.84);
      border-color: rgba(45,212,191,0.34);
      box-shadow: inset 0 0 0 1px rgba(45,212,191,0.08);
    }
    body[data-page="daily"] button,
    body[data-page="daily"] .top a,
    body[data-page="daily"] input,
    body[data-page="daily"] textarea{
      min-height:36px;
      border-color: var(--daily-tap-border) !important;
      background: var(--daily-tap-bg) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 0 1px rgba(45,212,191,0.10);
      touch-action: manipulation;
    }
    body[data-page="daily"] textarea{
      background: rgba(3,15,24,0.84) !important;
      border-color: rgba(251,191,36,0.38) !important;
      color:#f8fafc !important;
      caret-color:#fde68a;
    }
    body[data-page="daily"] textarea::placeholder{ color:rgba(226,232,240,0.62); }
    body[data-page="daily"] input[type="checkbox"]{
      width:20px;
      height:20px;
      min-height:20px;
      padding:0;
      accent-color:#7dd3fc;
      background: transparent !important;
      box-shadow:none;
    }
    body[data-page="daily"] label[title]{
      min-height:36px;
      padding:4px 8px;
      border:1px solid rgba(125,211,252,0.34);
      border-radius:999px;
      background: rgba(8,47,54,0.62);
    }
    body[data-page="daily"] .top #openPrevDay,
    body[data-page="daily"] .top #openNextDay,
    body[data-page="daily"] .top #openToday{
      padding:6px 10px !important;
      border:1px solid var(--daily-tap-border) !important;
      border-radius:999px !important;
      background: var(--daily-tap-bg) !important;
      text-decoration:none !important;
    }
    body[data-page="daily"] button:active,
    body[data-page="daily"] .top a:active{
      transform: translateY(1px);
      filter: brightness(1.14);
    }
    body[data-page="daily"] #allRecordsTimeline:empty{
      min-height:44px;
      border:1px dashed rgba(255,255,255,0.14);
      border-radius:8px;
      background: rgba(255,255,255,0.035);
    }
  }

  /* responsive free record row: ensure add button stays visible on small screens */
  #freeRecordRow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #freeRecordRow input#freeKorean{ flex:1 1 220px; min-width:0; }
  #freeRecordRow button#freeAdd{ flex:0 0 auto; min-width:44px; }
  #selfKindnessRecordRow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #selfKindnessRecordRow input#selfKindnessText{ flex:1 1 220px; min-width:0; }
  #selfKindnessRecordRow button#selfKindnessAdd{ flex:0 0 auto; min-width:44px; }

  /* Generic one-line free record row */
  #freeTextRecordRow, #accomplishedRecordRow, #codingRecordRow, #mealImageRecordRow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #freeTextRecordRow input[type="text"], #accomplishedRecordRow input[type="text"], #codingRecordRow input[type="text"], #mealImageRecordRow .meal-image-file-wrap { flex:1 1 220px; min-width:0; }
  #freeTextRecordRow button, #accomplishedRecordRow button, #codingRecordRow button, #mealImageRecordRow button { flex:0 0 auto; min-width:44px; }
  /* Ensure inputs in the modal are not rendered as password bullets on some mobile browsers */
  #medEditor input, #medEditor textarea { -webkit-text-security: none !important; }
  /* Remove native number input spinners */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; -webkit-appearance: textfield; }

  /* Make modal close button clearly distinct from timeline delete buttons */
  #closeEditor{
    background:#2563eb;
    color:#fff;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:999px;
    padding:6px 10px;
    font-weight:700;
    line-height:1;
  }
  #closeEditor:hover{ filter:brightness(1.05); }

  /* Auth gate: ログイン前は内容を一切見せない */
  body:not([data-auth="true"]) #medEditor{ display:none !important; }
  body:not([data-auth="true"]) #openMonthly{ display:none !important; }
  </style>
</head>
<body data-page="daily" data-auth="false">
  <div class="top" style="display:flex;align-items:center;gap:12px;padding:12px">
    <button id="supabaseLoginBtn">Googleでログイン</button>
    <button id="signOutBtn" style="display:none">サインアウト</button>
    <div style="flex:1"></div>
    <div id="dailyControls" style="display:flex;align-items:center;gap:6px;margin-right:8px;">
      <button id="openPrevDay" style="background:transparent;border:none;color:#fff;text-decoration:none;cursor:pointer;padding:0;">◀</button>
      <button id="openToday" style="background:transparent;border:none;color:#fff;text-decoration:none;cursor:pointer;padding:0;">今日</button>
      <button id="openNextDay" style="background:transparent;border:none;color:#fff;text-decoration:none;cursor:pointer;padding:0;">▶</button>
    </div>
    <a id="openMonthly" href="monthly.html">月間</a>
    <div id="msg" style="color:#6b7280"></div>
  </div>

  <div class="container compact" style="padding:12px">
  <div id="medEditor">
    <div id="editSection" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <strong id="editDate" style="margin-right:8px;">-</strong>
      <div style="display:flex;gap:8px;align-items:center;flex:1;justify-content:center">
        <button data-action="record" data-kind="wake" class="time-btn" title="起床" style="padding:6px 10px;border-radius:6px;font-size:1.2em;line-height:1">🌅</button>
        <button data-action="record" data-kind="awake" class="time-btn" title="覚醒" style="padding:6px 10px;border-radius:6px;font-size:1.2em;line-height:1">👀</button>
        <button data-action="record" data-kind="sleep" class="time-btn" title="就寝" style="padding:6px 10px;border-radius:6px;font-size:1.2em;line-height:1">🌙</button>
      </div>
      <button id="closeEditor" type="button" aria-label="閉じる" style="display:none">閉じる</button>
    </div>
    
    <!-- （重複していた下部の起床/就寝ボタンはヘッダに統合済みのため削除） -->

    <div id="dailySplit">
      <div id="dailyTimelineCol" class="panel-box">
        <div class="panel-title">タイムライン</div>
        <!-- 時刻順統一表示エリア（起床・就寝の表示と編集機能を含む） -->
        <div id="allRecordsTimeline"></div>
      </div>

      <div id="dailyInputCol" class="panel-box">
        <div class="panel-title">入力</div>

        <div class="med-timer" id="medTimerBox" style="margin-bottom:8px;display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0">
          <strong style="width:56px">瞑想</strong>
          <input id="medTimerMin" type="number" min="0.01" step="0.01" value="30" style="width:84px" />
          <span id="medTimerDisplay" style="min-width:56px;text-align:center">--:--</span>
          <button id="medTimerStart">開始</button>
          <button id="medTimerClear" style="display:none;padding:6px 8px;border-radius:6px;background:transparent;border:1px solid rgba(255,255,255,0.08);">クリア</button>
        </div>

        <!-- 従来の個別表示エリア（非表示） -->
        <div class="med-sessions" id="medSessions" style="display:none;margin-bottom:4px"></div>
        <div id="exerciseList" style="display:none;margin-bottom:4px"></div>

        <div id="tongueRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <strong style="width:56px;opacity:0.9">舌</strong>
          <div style="flex:1"></div>
          <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9" title="タイムスタンプを付ける">
            <input id="tongueUseTime" type="checkbox" checked />
            <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
          </label>
          <button id="tongueAdd">記録</button>
        </div>

      <div id="periodRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <strong style="width:56px;opacity:0.9">生理</strong>
        <span style="opacity:0.9;white-space:nowrap">n日目</span>
        <input id="periodDay" type="number" min="1" value="1" style="width:4ch;padding:0 4px;text-align:center" />
        <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9" title="タイムスタンプを付ける">
          <input id="periodUseTime" type="checkbox" checked />
          <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
        </label>
        <button id="periodAdd">記録</button>
      </div>
      <!-- 自由入力: 他の記録と同じフォーマットで追加できる1行欄 -->
      <div id="freeRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
    <strong style="width:56px;opacity:0.9">韓国語</strong>
    <input id="freeKorean" name="free_record_korean" type="text" placeholder="内容（例: 아침 요가）" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff" />
    <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9" title="タイムスタンプを付ける">
      <input id="freeUseTime" type="checkbox" checked />
      <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
    </label>
        <button id="freeAdd">追加</button>
      </div>

      <div id="selfKindnessRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <strong style="flex-shrink:0;opacity:0.9">self-kindness journal</strong>
        <input id="selfKindnessText" name="self_kindness_text" type="text" placeholder="What did you do well today?" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff" />
        <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9" title="タイムスタンプを付ける">
          <input id="selfKindnessUseTime" type="checkbox" checked />
          <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
        </label>
        <button id="selfKindnessAdd">追加</button>
      </div>

      <div id="freeTextRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <strong style="width:56px;opacity:0.9">自由</strong>
        <input id="freeText" name="free_record_text" type="text" placeholder="内容（例: 買い物 / 掃除）" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff" />
        <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9" title="タイムスタンプを付ける">
          <input id="freeTextUseTime" type="checkbox" checked />
          <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
        </label>
        <button id="freeTextAdd">追加</button>
      </div>

      <div id="accomplishedRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <strong style="width:110px;opacity:0.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Accomplished</strong>
        <input id="accomplished" name="accomplished_record_text" type="text" placeholder="内容" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" style="flex:1;min-width:0;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff" />
        <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9;flex-shrink:0" title="タイムスタンプを付ける">
          <input id="accomplishedUseTime" type="checkbox" checked />
          <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
        </label>
        <button id="accomplishedAdd" style="flex-shrink:0">追加</button>
      </div>

      <div id="codingRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <strong style="width:56px;opacity:0.9">コーディング</strong>
        <input id="codingText" name="coding_record_text" type="text" placeholder="内容（例: ACG2修正）" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff" />
        <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9" title="タイムスタンプを付ける">
          <input id="codingUseTime" type="checkbox" checked />
          <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
        </label>
        <button id="codingAdd">追加</button>
      </div>

      <div id="mealImageRecordRow" style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
        <strong style="width:56px;opacity:0.9">食事画像</strong>
        <label class="meal-image-file-wrap" style="flex:1;min-width:0;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">
          <input id="mealImageFile" type="file" accept="image/*" capture="environment" style="display:none" />
          <span id="mealImageFileName" style="opacity:0.9;overflow:hidden;text-overflow:ellipsis">画像を選択</span>
        </label>
        <label style="display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;opacity:0.9" title="タイムスタンプを付ける">
          <input id="mealImageUseTime" type="checkbox" checked />
          <span aria-label="時計" style="font-size:18px;line-height:1">🕒</span>
        </label>
        <button id="mealImageAdd">保存</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
      </div>

    <div id="exerciseTimers" style="display:flex;flex-direction:column;gap:8px;margin-bottom:4px">
        <div class="exercise-timer" style="display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0">
          <strong style="width:56px">プランク</strong>
  <input id="plankSec" type="number" min="1" value="30" style="width:4ch;padding:0 4px;text-align:center" /> 秒
          <span id="plankDisplay" style="min-width:48px;text-align:center">--:--</span>
          <button id="plankStart">開始</button>
        </div>
        <div class="exercise-timer" style="display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0">
          <strong style="width:56px">空気椅子</strong>
  <input id="wallSec" type="number" min="1" value="30" style="width:4ch;padding:0 4px;text-align:center" /> 秒
          <span id="wallDisplay" style="min-width:48px;text-align:center">--:--</span>
          <button id="wallStart">開始</button>
        </div>

        <div class="exercise-timer" style="display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0;flex-wrap:wrap">
          <strong style="width:56px">片付け</strong>
          <input id="cleanupText" type="text" placeholder="任意（例: キッチン）" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" style="flex:1;min-width:80px;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff" />
          <div style="display:flex;gap:8px;align-items:center">
            <span style="opacity:0.9;white-space:nowrap">5分</span>
            <span id="cleanupDisplay" style="min-width:48px;text-align:center">--:--</span>
            <button id="cleanupStart">開始</button>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="cleanupMin" type="number" min="1" value="5" style="width:4ch;padding:0 4px;text-align:center" /> 分
            <button id="cleanupRecord">記録</button>
          </div>
        </div>
      </div>
      <!-- 追加 / 日クリア ボタンは不要のため削除 -->
        <div id="recordSection" style="margin:10px 0 8px;">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <label>記録</label>
            <button id="insertRecordTimeBtn" title="現在時刻を挿入" style="background:transparent;border:none;color:#fff;font-size:18px;line-height:1;padding:4px 6px;">🕒</button>
          </div>
          <textarea id="medRecordText" placeholder="メモ" style="width:100%;min-height:100px"></textarea>
        </div>

        <div id="diarySection" style="margin-bottom:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <label>日記</label>
            <button id="insertTimeBtn" title="現在時刻を挿入" style="background:transparent;border:none;color:#fff;font-size:18px;line-height:1;padding:4px 6px;">🕒</button>
          </div>
          <textarea id="medDiaryText" placeholder="メモ" style="width:100%;min-height:100px"></textarea>
        </div>
      </div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  </body>
  </html>
