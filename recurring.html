<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>繰り返し記録 | Ritual Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="recurring-dashboard.js"></script>
  <style>
    body { overflow:auto; }
    .dashboard { max-width:900px; margin:0 auto; padding:20px 16px 40px; }
    .dashboard-header { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .dashboard-header h1 { margin:0; flex:1; }
    .dashboard-header a { color:var(--accent); }
    .dashboard-grid { display:grid; grid-template-columns:minmax(280px, .85fr) minmax(320px, 1.15fr); gap:16px; align-items:start; }
    .dashboard-card { background:var(--card); border:1px solid var(--grid); border-radius:14px; padding:16px; }
    .dashboard-card h2 { font-size:1.05rem; margin:0 0 14px; }
    .form-field { display:grid; gap:6px; margin-bottom:12px; }
    .form-field input[type="text"], .form-field input[type="time"] { width:100%; }
    .weekday-list { display:flex; flex-wrap:wrap; gap:6px; }
    .weekday-option { display:inline-flex; align-items:center; gap:4px; padding:6px 8px; border:1px solid var(--grid); border-radius:999px; color:var(--text); cursor:pointer; }
    .weekday-option input { width:16px; height:16px; padding:0; accent-color:var(--accent); }
    .primary-button { width:100%; background:#2454a6; }
    .status { min-height:1.4em; margin:12px 0 0; color:var(--muted); font-size:.9rem; }
    .status.error { color:var(--danger); }
    .status.success { color:var(--ok); }
    .entry-list { display:grid; gap:10px; }
    .entry { display:flex; align-items:center; gap:10px; padding:12px; background:rgba(255,255,255,.035); border:1px solid var(--grid); border-radius:10px; }
    .entry-copy { flex:1; min-width:0; }
    .entry-title { font-weight:700; overflow-wrap:anywhere; }
    .entry-meta { color:var(--muted); font-size:.82rem; margin-top:4px; }
    .entry-actions { display:flex; gap:6px; }
    .entry-actions button { padding:7px 10px; }
    .entry-actions .record-button { background:#17623e; }
    .entry-actions .delete-button { color:#ff9c9c; }
    .empty-state { color:var(--muted); padding:14px 4px; }
    #login-section { display:none; text-align:center; padding:30px 16px; }
    #main-section { display:none; }
    #sign-out { display:none; }
    @media (max-width:700px) {
      .dashboard-grid { grid-template-columns:1fr; }
      .dashboard-header { flex-wrap:wrap; }
      .dashboard-header h1 { flex-basis:100%; }
      .entry { align-items:flex-start; flex-wrap:wrap; }
      .entry-actions { width:100%; justify-content:flex-end; }
    }
  </style>
</head>
<body data-auth="false">
  <div class="dashboard">
    <header class="dashboard-header">
      <h1>繰り返し記録</h1>
      <a href="index.html">今日の記録へ戻る</a>
      <button id="sign-out" type="button">サインアウト</button>
    </header>

    <section id="login-section" class="dashboard-card">
      <p>繰り返し記録を使うにはログインしてください。</p>
      <button id="sign-in" type="button">Googleでログイン</button>
    </section>

    <main id="main-section">
      <div class="dashboard-grid">
        <section class="dashboard-card">
          <h2>繰り返し項目を登録</h2>
          <form id="recurring-form">
            <label class="form-field">
              <span>記録する内容</span>
              <input id="entry-title" type="text" maxlength="80" required placeholder="例：薬を飲む、ストレッチ">
            </label>
            <label class="form-field">
              <span>記録する曜日</span>
              <span class="weekday-list">
                <label class="weekday-option"><input type="checkbox" name="weekday" value="1" checked>月</label>
                <label class="weekday-option"><input type="checkbox" name="weekday" value="2" checked>火</label>
                <label class="weekday-option"><input type="checkbox" name="weekday" value="3" checked>水</label>
                <label class="weekday-option"><input type="checkbox" name="weekday" value="4" checked>木</label>
                <label class="weekday-option"><input type="checkbox" name="weekday" value="5" checked>金</label>
                <label class="weekday-option"><input type="checkbox" name="weekday" value="6" checked>土</label>
                <label class="weekday-option"><input type="checkbox" name="weekday" value="0" checked>日</label>
              </span>
            </label>
            <label class="form-field">
              <span>予定時刻（任意）</span>
              <input id="entry-time" type="time">
            </label>
            <button class="primary-button" type="submit">項目を追加</button>
          </form>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>

        <section class="dashboard-card">
          <h2 id="today-heading">今日の予定</h2>
          <div id="today-list" class="entry-list"></div>
        </section>
      </div>

      <section class="dashboard-card" style="margin-top:16px">
        <h2>登録済みの繰り返し項目</h2>
        <div id="all-list" class="entry-list"></div>
      </section>
    </main>
  </div>
</body>
</html>
